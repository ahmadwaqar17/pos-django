<!-- templates/registration/change_password.html -->
{% extends 'base.html' %}

{% block title %}
Change Password | Online Retail POS
{% endblock %}

{% block nav-item %}
<div class="mb-0 font-weight-bold h5 text-gray-800 text-uppercase p-3 d-flex align-items-center">
    <i class="fas fa-key mr-2 text-primary"></i> Change Password
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center m-0">
    <div class="col-lg-6">
        <div class="card o-hidden shadow-sm my-5">
            <div class="card-header bg-white py-3">
                <h1 class="h5 text-gray-900 mb-0 font-weight-bold">
                    <i class="fas fa-shield-alt mr-2 text-primary"></i>Update Password
                </h1>
            </div>
            <div class="card-body p-4">
                <form method="post" data-loading-text="Updating password…">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <hr>
                    <button type="submit" class="btn btn-primary btn-user btn-block">
                        <i class="fas fa-check mr-1"></i> Change Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<style>
    #content form p { margin-bottom: 1rem; }
    #content form label {
        display: block;
        font-size: .72rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .07em;
        color: #64748b;
        margin-bottom: .35rem;
    }
</style>
{% endblock %}
