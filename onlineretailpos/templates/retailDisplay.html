<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow" />
<title>Customer Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#2b2f6b;
    --brand-deep:#1e2150;
    --accent:#4e5ae8;
    --accent-soft:#eef0fd;
    --bg:#f4f5fb;
    --surface:#ffffff;
    --ink:#1f2340;
    --ink-soft:#5f6383;
    --ink-faint:#9a9db8;
    --rule:#e6e8f2;
    --money:#12a46a;
    --saving:#e0475b;

    --pad: clamp(18px, 2vw, 40px);
    --step-0: clamp(13px, .9vw, 18px);
    --step-1: clamp(16px, 1.25vw, 24px);
    --step-2: clamp(20px, 1.7vw, 34px);
    --step-3: clamp(44px, 5.4vw, 112px);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Nunito","Helvetica Neue",Arial,sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .screen{
    height:100vh; height:100dvh;
    display:grid;
    grid-template-columns:minmax(0,1fr) clamp(300px, 32vw, 560px);
  }

  /* ---------- left: the live item list ---------- */
  .items{
    display:grid;
    grid-template-rows:auto minmax(0,1fr);
    padding:var(--pad);
    gap:clamp(12px,1.2vw,22px);
    min-width:0;
  }
  .items-head{
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
  }
  .items-head h2{
    font-size:var(--step-0); font-weight:800; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-faint);
  }
  .live{
    display:flex; align-items:center; gap:.5em;
    font-size:var(--step-0); font-weight:700; color:var(--ink-soft);
  }
  .pulse{
    width:.6em; height:.6em; border-radius:50%; background:var(--money);
    box-shadow:0 0 0 0 rgba(18,164,106,.5); animation:ping 2s ease-out infinite;
  }
  .pulse.is-stale{background:var(--saving); animation:none}
  @keyframes ping{
    0%{box-shadow:0 0 0 0 rgba(18,164,106,.45)}
    80%,100%{box-shadow:0 0 0 .7em rgba(18,164,106,0)}
  }

  .list{
    background:var(--surface);
    border-radius:20px;
    box-shadow:0 8px 30px rgba(31,35,64,.06);
    overflow-y:auto;
    scrollbar-width:none;
    display:flex; flex-direction:column;
  }
  .list::-webkit-scrollbar{display:none}

  .line{
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;
    gap:clamp(12px,1.2vw,22px);
    padding:clamp(12px,1.1vw,20px) clamp(16px,1.6vw,28px);
    border-bottom:1px solid var(--rule);
    transition:background .3s;
  }
  .line:last-child{border-bottom:0}
  .qty{
    min-width:2.4em; height:2.4em; padding:0 .5em; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); color:var(--accent);
    font-size:var(--step-1); font-weight:800;
  }
  .name{
    font-size:var(--step-2); font-weight:700; line-height:1.15;
    overflow-wrap:anywhere;
  }
  .meta{font-size:var(--step-0); color:var(--ink-faint); margin-top:.15em}
  .amount{font-size:var(--step-2); font-weight:800; white-space:nowrap}

  .line.is-latest{background:linear-gradient(90deg, var(--accent-soft), transparent 70%)}
  .line.is-latest .qty{background:var(--accent); color:#fff}
  .line.just-scanned{animation:land .7s cubic-bezier(.2,.8,.2,1)}
  @keyframes land{
    from{transform:translateY(14px); opacity:0}
    to{transform:none; opacity:1}
  }

  .empty{
    margin:auto; text-align:center; padding:var(--pad); color:var(--ink-faint);
  }
  .empty .scan{
    width:clamp(64px,6vw,110px); height:clamp(64px,6vw,110px); margin:0 auto 1rem;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); color:var(--accent);
  }
  .empty .scan svg{width:50%; height:50%}
  .empty p{font-size:var(--step-2); font-weight:700}
  .empty span{display:block; font-size:var(--step-0); margin-top:.4em}

  /* ---------- right: store + totals ---------- */
  .summary{
    background:linear-gradient(170deg, var(--brand) 0%, var(--brand-deep) 100%);
    color:#fff;
    display:flex; flex-direction:column;
    padding:var(--pad);
    gap:var(--pad);
    min-width:0; overflow:hidden;
  }
  .brand{display:flex; align-items:center; gap:.9rem; min-width:0}
  .brand > div:last-child{min-width:0}
  .store{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .logo{
    width:clamp(44px,3.6vw,64px); height:clamp(44px,3.6vw,64px); border-radius:16px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#6c7bff,var(--accent));
    box-shadow:0 8px 20px rgba(78,90,232,.45);
  }
  .logo svg{width:52%; height:52%}
  .store{font-size:var(--step-1); font-weight:800; line-height:1.15}
  .clock{font-size:var(--step-0); color:rgba(255,255,255,.6); margin-top:.15em}

  .welcome{margin:auto 0}
  .totals{margin-top:auto; min-width:0}
  .welcome h1{font-size:var(--step-2); font-weight:800; line-height:1.15}
  .welcome p{font-size:var(--step-0); color:rgba(255,255,255,.6); margin-top:.5em}

  .breakdown{display:grid; gap:.55rem; margin-bottom:1rem}
  .row{
    display:flex; justify-content:space-between; gap:1rem;
    font-size:var(--step-1); color:rgba(255,255,255,.72);
  }
  .row span:last-child{white-space:nowrap}
  .row.saving{color:#ff9aa8}

  .total-card{
    background:#fff; color:var(--ink);
    border-radius:20px;
    padding:clamp(16px,1.6vw,30px);
    box-shadow:0 18px 40px rgba(0,0,0,.25);
    container-type:inline-size;   /* lets the total scale with the card, not the window */
  }
  .total-top{display:flex; justify-content:space-between; align-items:center; gap:.5rem 1rem; flex-wrap:wrap}
  .total-label{
    font-size:var(--step-0); font-weight:800; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-faint);
  }
  .count{
    font-size:var(--step-0); font-weight:700; color:var(--accent);
    background:var(--accent-soft); border-radius:999px; padding:.2em .8em;
  }
  .figure{display:flex; align-items:baseline; gap:.3em; margin-top:.4rem; color:var(--money); min-width:0; overflow:hidden}
  .cur{font-size:var(--step-1); font-weight:800; color:var(--ink-soft); flex:none}
  .digits{
    font-size:var(--step-3);
    font-size:clamp(34px, 15cqi, 112px);
    font-weight:900; letter-spacing:-.03em; line-height:1; white-space:nowrap;
  }
  .digits.bump{animation:bump .35s ease}
  @keyframes bump{50%{transform:scale(1.04)}}

  /* small laptops / large tablets */
  @media (max-width:1200px){
    .screen{grid-template-columns:minmax(0,1fr) clamp(280px, 38vw, 460px)}
  }

  /* tablets and phones: totals on top, items below, page scrolls */
  @media (max-width:900px){
    body{overflow:auto}
    .screen{grid-template-columns:1fr; grid-template-rows:auto minmax(55vh,1fr); height:auto; min-height:100vh; min-height:100dvh}
    .summary{order:-1; gap:1rem; padding:16px}
    .welcome{display:none}
    .totals{margin-top:0}
    .list{border-radius:16px}
    :root{
      --step-0: 14px;
      --step-1: 17px;
      --step-2: 20px;
    }
  }

  /* phones */
  @media (max-width:560px){
    .items{padding:12px; gap:10px}
    .line{grid-template-columns:auto minmax(0,1fr); grid-template-areas:"qty info" "qty amount"; row-gap:.25rem; padding:12px 14px}
    .line .qty{grid-area:qty; align-self:start; min-width:2.1em; height:2.1em; border-radius:10px}
    .line > div{grid-area:info}
    .line .amount{grid-area:amount; justify-self:start; color:var(--ink-soft); font-size:17px}
    .logo{width:40px; height:40px; border-radius:12px}
    .total-card{border-radius:16px}
  }

  /* short landscape screens (small tablets on a stand) */
  @media (min-width:901px) and (max-height:560px){
    :root{--pad:16px}
    .welcome{display:none}
    .line{padding-top:8px; padding-bottom:8px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important; transition:none!important}
  }
</style>
</head>
<body>

<main class="screen">
  <section class="items">
    <header class="items-head">
      <h2>Your items</h2>
      <p class="live"><span class="pulse" id="pulse"></span><span id="liveText">Live</span></p>
    </header>
    <div class="list" id="list"></div>
  </section>

  <aside class="summary">
    <header class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7"/><path d="M10 20v-4h4v4"/>
        </svg>
      </div>
      <div>
        <div class="store" id="storeName">{{ store_name }}</div>
        <div class="clock" id="clock"></div>
      </div>
    </header>

    <div class="welcome" id="welcome">
      <h1>Welcome!</h1>
      <p>Your items and total will appear here as the cashier scans them.</p>
    </div>

    <div class="totals">
      <div class="breakdown" id="breakdown" hidden>
        <div class="row" id="rowSubtotal"><span>Subtotal</span><span id="subtotal">0.00</span></div>
        <div class="row" id="rowTax" hidden><span>Tax</span><span id="tax">0.00</span></div>
        <div class="row" id="rowDeposit" hidden><span>Deposit</span><span id="deposit">0.00</span></div>
        <div class="row saving" id="rowDiscount" hidden><span id="discountLabel">Discount</span><span id="discount">0.00</span></div>
      </div>
      <div class="total-card">
        <div class="total-top">
          <span class="total-label">Total</span>
          <span class="count" id="count">0 items</span>
        </div>
        <div class="figure"><span class="cur" id="cur">PKR</span><span class="digits" id="total">0.00</span></div>
      </div>
    </div>
  </aside>
</main>

<script>
/* Polls the Django JSON endpoint for the live cart. */
const POLL_URL = "/retail_display/values/";
const POLL_MS  = 2000;

const money = n => Number(n || 0).toLocaleString("en-PK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let lastKey = null, lastTotal = null;

const EMPTY_HTML = `<div class="empty">
  <div class="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M17 8v8"/></svg></div>
  <p>Ready when you are</p><span>Waiting for the first item to be scanned</span></div>`;

function render(s) {
  if (s.store) $("storeName").textContent = s.store;
  $("cur").textContent = s.currency || "PKR";

  const items = s.items || [];
  const list = $("list");
  const units = items.reduce((n, i) => n + i.qty, 0);
  const newest = items[items.length - 1];
  const key = newest ? newest.id + ":" + newest.qty + ":" + items.length : null;

  if (!items.length) {
    list.innerHTML = EMPTY_HTML;
  } else if (key !== lastKey || list.querySelector(".empty")) {
    list.innerHTML = items.map((i, idx) => {
      const latest = idx === items.length - 1;
      const fresh = latest && lastKey !== null;
      return `<div class="line ${latest ? "is-latest" : ""} ${fresh ? "just-scanned" : ""}">
        <span class="qty">${i.qty}&times;</span>
        <div><div class="name">${esc(i.name)}</div><div class="meta">${money(i.price)} each</div></div>
        <span class="amount">${money(i.line_total)}</span>
      </div>`;
    }).join("");
    list.scrollTop = list.scrollHeight;
  }
  lastKey = key;

  const hasItems = items.length > 0;
  $("welcome").hidden = hasItems;
  $("breakdown").hidden = !hasItems;
  $("subtotal").textContent = money(s.gross_total);
  $("tax").textContent = money(s.tax_total);
  $("rowTax").hidden = !(s.tax_total > 0);
  $("deposit").textContent = money(s.deposit_total);
  $("rowDeposit").hidden = !(s.deposit_total > 0);
  $("discount").innerHTML = "&minus;" + money(s.discount);
  $("discountLabel").textContent = s.discount_percent ? `Discount (${s.discount_percent}%)` : "Discount";
  $("rowDiscount").hidden = !(s.discount > 0);

  $("count").textContent = `${units} item${units === 1 ? "" : "s"}`;
  const total = money(s.total);
  if (total !== lastTotal) {
    const el = $("total");
    el.textContent = total;
    fitTotal();
    if (lastTotal !== null) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
    lastTotal = total;
  }
}

/* Shrink the total if it still doesn't fit its card (very large amounts or
   browsers without container query units). */
function fitTotal() {
  const el = $("total"), box = el.parentElement;
  el.style.fontSize = "";
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (box.scrollWidth > box.clientWidth && size > 20) {
    size -= 2;
    el.style.fontSize = size + "px";
  }
}
window.addEventListener("resize", fitTotal);

function tick() {
  $("clock").textContent = new Date().toLocaleString("en-PK", {
    weekday: "short", day: "numeric", month: "short",
    hour: "2-digit", minute: "2-digit", hour12: true
  });
}

async function poll() {
  try {
    const res = await fetch(POLL_URL, { headers: { "X-Requested-With": "fetch" }, credentials: "same-origin" });
    if (!res.ok) throw new Error(res.status);
    render(await res.json());
    $("pulse").classList.remove("is-stale");
    $("liveText").textContent = "Live";
  } catch {
    $("pulse").classList.add("is-stale");     // cashier can see the screen went stale
    $("liveText").textContent = "Reconnecting…";
  }
}

$("list").innerHTML = EMPTY_HTML;
tick();
setInterval(tick, 1000);
setInterval(poll, POLL_MS);
poll();
</script>
</body>
</html>
